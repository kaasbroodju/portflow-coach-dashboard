{# Specs 035, 037: the side panel for feedback and evaluations; app.js fills it on a click on a
   link with data-feedback. #}
<aside class="side-panel" id="feedback-panel" hidden aria-labelledby="feedback-panel-title">
  <div class="side-panel-head">
    <h2 id="feedback-panel-title">Feedback</h2>
    <button class="icon-button" type="button" data-close-panel aria-label="Sluiten">×</button>
  </div>
  <div class="side-panel-body" id="feedback-panel-body"></div>
</aside>
