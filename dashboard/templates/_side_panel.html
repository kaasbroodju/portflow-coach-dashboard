{# Specs 035, 037: the side panel for feedback and evaluations; app.js fills it on a click on a
   link with data-feedback. #}
<aside class="side-panel" id="feedback-panel" hidden aria-labelledby="feedback-panel-title">
  <div class="side-panel-head">
    <h2 id="feedback-panel-title">Feedback</h2>
    <button class="icon-button" type="button" data-close-panel aria-label="Sluiten">×</button>
  </div>
  <div class="side-panel-body" id="feedback-panel-body"></div>
</aside>
{# Spec 038, F1a: a file over almost the whole screen ("Groot bekijken"); filled by app.js. #}
<div class="file-viewer" id="file-viewer" hidden role="dialog" aria-modal="true" aria-labelledby="file-viewer-title">
  <div class="file-viewer-box">
    <div class="file-viewer-head">
      <h2 id="file-viewer-title">Bestand</h2>
      <button class="icon-button" type="button" data-close-viewer aria-label="Sluiten">×</button>
    </div>
    <div class="file-viewer-body" id="file-viewer-body"></div>
  </div>
</div>
